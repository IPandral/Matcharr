name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ipandral/matcharr

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      rustydb:
        image: ghcr.io/ipandral/rustydb@sha256:89e77a7f364166e852c944100e7068eeab4a4b8a1856d9ed4b5756d19f34ba44
        env:
          RUSTYDB_HOST: 0.0.0.0
          RUSTYDB_PORT: "8080"
          RUSTYDB_WIRE_PORT: "3307"
          RUSTYDB_USERNAME: matcharr
          RUSTYDB_PASSWORD: ci-isolated-db-only
          RUSTYDB_MEMORY_ONLY: "true"
        ports:
          - 3307:3307
        options: >-
          --health-cmd "curl --fail http://127.0.0.1:8080/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python unit and integration tests
        env:
          MATCHARR_RUSTYDB_INTEGRATION: "1"
          RUSTYDB_HOST: 127.0.0.1
          RUSTYDB_WIRE_PORT: "3307"
          RUSTYDB_USERNAME: matcharr
          RUSTYDB_PASSWORD: ci-isolated-db-only
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run JavaScript tests
        run: npm test

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Select release version
        id: version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
            if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Run the workflow on the current main commit to publish a release."
              exit 1
            fi
          fi

          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[] | [.name, .commit.sha] | @tsv')
          stable_tags=$(awk '$1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/' <<< "$tags")
          tag=$(awk -v sha="$GITHUB_SHA" '$2 == sha {print $1}' <<< "$stable_tags" | sort -V | tail -n 1)
          if [[ -z "$tag" ]]; then
            latest=$(awk '{print $1}' <<< "$stable_tags" | sort -V | tail -n 1)
            tag=v1.0.0
            if [[ -n "$latest" ]]; then
              IFS=. read -r major minor _ <<< "${latest#v}"
              tag="v$major.$((10#$minor + 1)).0"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Matcharr
            org.opencontainers.image.description=Swipe together and match movies from Plex or Jellyfin
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub release
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release notes and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Matcharr ${RELEASE_TAG#v}" --generate-notes
          fi
